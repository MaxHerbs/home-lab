opentelemetry-collector:
  image:
    repository: otel/opentelemetry-collector-contrib
  mode: deployment
  ports:
    prometheus:
      enabled: true
      containerPort: 9090
      servicePort: 9090
      protocol: TCP
    otlp-grpc:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      protocol: TCP
    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318
      protocol: TCP

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    exporters:
      prometheus:
        endpoint: 0.0.0.0:9090
      otlp:
        endpoint: "{{ .Release.Name }}-tempo:4317"
        tls:
          insecure: true
      debug: {}

    service:
      pipelines:
        metrics:
          receivers: [otlp]
          exporters: [prometheus, debug]
        traces:
          receivers: [otlp]
          exporters: [otlp, debug]

      telemetry:
        logs:
          level: "DEBUG"
          development: true
          encoding: "json"

  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - host: otel-collector.theoffice.uk
        paths:
          - path: /
            pathType: Prefix
            port: 4318

tempo:
  replicaCount: 1
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
  compactor:
    enabled: true
  ingester:
    replicaCount: 1
  distributor:
    replicaCount: 1
  queryFrontend:
    enabled: true
  querier:
    replicaCount: 1
  service:
    type: ClusterIP
    ports:
      http: 3100
      grpc: 4317
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - host: tempo.theoffice.uk
        paths:
          - path: /
            pathType: Prefix



prometheus:
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  prometheus-node-exporter:
    enabled: true
  server:
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - prometheus.theoffice.uk

grafana:
  enabled: true
  initChownData:
    enabled: false

  adminUser: admin
  adminPassword: supersecurepassword

  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.theoffice.uk
    paths:
      - path: /
        pathType: Prefix
    tls:
      - secretName: tls-grafana
        hosts:
          - grafana.theoffice.uk

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://{{ .Release.Name }}-prometheus-server
          isDefault: true
        - name: Tempo
          type: tempo
          access: proxy
          url: http://{{ .Release.Name }}-tempo:3100
          jsonData:
            maxTraceDuration: "24h"

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  dashboards:
    default:
      node-exporter-full:
        gnetId: 1860
        revision: 29
        datasource: Prometheus
      kubernetes-monitoring:
        gnetId: 12740
        revision: 1
        datasource: Prometheus
      kubernetes-cluster-monitoring:
        gnetId: 315
        revision: 2
        datasource: Prometheus
      kubernetes-monitoring-overview:
        gnetId: 14623
        revision: 1
        datasource: Prometheus
      monitoring-golden-signals:
        gnetId: 21073
        revision: 1
        datasource: Prometheus
      compute-resources-namespace-pods:
        gnetId: 12117
        revision: 1
        datasource: Prometheus
      networking-namespace-pods:
        gnetId: 12125
        revision: 1
        datasource: Prometheus
      kubernetes-deployments:
        gnetId: 5225
        revision: 1
        datasource: Prometheus
      k8s-cluster-deployments:
        gnetId: 9619
        revision: 1
        datasource: Prometheus

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      folder: default

  plugins:
    - grafana-piechart-panel
