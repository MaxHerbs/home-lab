apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd
  namespace: argocd
spec:
  secretName: tls-argocd
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
  commonName: argo-cd.theoffice.uk
  dnsNames:
    - argo-cd.theoffice.uk
  usages:
    - digital signature
    - key encipherment
    - server auth
