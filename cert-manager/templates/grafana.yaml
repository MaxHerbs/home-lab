apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana
  namespace: monitoring
spec:
  secretName: tls-grafana
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
  commonName: grafana.theoffice.uk
  dnsNames:
    - grafana.theoffice.uk
  usages:
    - digital signature
    - key encipherment
    - server auth
